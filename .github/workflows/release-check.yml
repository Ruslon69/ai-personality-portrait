name: Release Check

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or proposed release tag
        required: true
        type: string
  push:
    tags:
      - 'sprint-*'
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-check:
    name: Validate release candidate
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install and verify FFmpeg
        run: sudo bash scripts/install-ci-media-tools.sh
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e '.[dev]'
      - name: Validate tag and release metadata
        run: |
          node scripts/release-metadata.mjs validate
          node scripts/release-metadata.mjs validate-tag "$RELEASE_TAG"
      - name: Verify candidate belongs to main history
        run: |
          git fetch --quiet --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Frontend lint and format
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check
      - name: Frontend build and quality
        working-directory: frontend
        run: |
          npm run build
          npm run quality -- --report=reports/quality-gates.json
          npm audit --omit=dev
      - name: Backend checks
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
          python -c 'from app.main import app; assert app is not None'
          python ../scripts/backend-health-smoke.py
      - name: Repository hygiene
        run: |
          node scripts/repo-hygiene.mjs
          node scripts/validate-workflows.mjs
      - name: Reproducible production build
        run: node scripts/build-reproducibility.mjs
      - name: Release metadata summary
        run: node scripts/release-metadata.mjs summary --tag="$RELEASE_TAG" --output=.release/release-metadata.summary.json
      - name: Generated commands leave tracked files clean
        run: git diff --exit-code
      - name: Upload release validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ github.run_id }}
          path: |
            frontend/dist
            frontend/reports/quality-gates.json
            .release/release-metadata.summary.json
          if-no-files-found: warn
          retention-days: 14
